<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pisá — Caja Kit Primer Paso</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../../../fuentes/BricolageGrotesque.ttf') format('truetype');font-weight:200 800;font-display:block}
@font-face{font-family:'Figtree';src:url('../../../fuentes/Figtree.ttf') format('truetype');font-weight:300 900;font-display:block}
</style>
<style>
body{margin:0}
a{color:#12302C}a:hover{color:#C2481E}
</style>
</head>
<body>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; padding: 110px 160px; display: flex; align-items: center; justify-content: center; background: #E4EAE6; font-family: 'Figtree', sans-serif;">
  <div style="width: 760px; height: 860px; box-sizing: border-box; border-radius: 22px; background: #12302C; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 60px rgba(18, 48, 44, 0.25);">

    <div style="flex-grow: 1; padding: 56px 60px 40px; display: flex; flex-direction: column; gap: 36px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="58" height="36" viewBox="0 0 72 44" fill="none" aria-hidden="true"><path d="M4 36 H18 C26 36 28 10 42 10 C54 10 58 36 68 36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="11" cy="36" r="6" fill="#F0643A"></circle></svg>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -0.045em;">pis<span style="color: #F0643A;">á</span></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #F0643A;">Kit</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 104px; line-height: 0.92; letter-spacing: -0.04em;">Primer<br>Paso</div>
        <div style="font-size: 24px; line-height: 1.35; color: #CFE6DC; max-width: 520px;">Alivio y soporte para talón y arco, desde que te levantás.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: center; gap: 14px; font-size: 19px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#F0643A"></circle><path d="M7 12.5l3.2 3.2L17 9" stroke="#12302C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span>1 par de plantillas de gel recortables</span>
        </div>
        <div style="display: flex; align-items: center; gap: 14px; font-size: 19px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#F0643A"></circle><path d="M7 12.5l3.2 3.2L17 9" stroke="#12302C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span>1 par de taloneras de gel</span>
        </div>
        <div style="display: flex; align-items: center; gap: 14px; font-size: 19px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#F0643A"></circle><path d="M7 12.5l3.2 3.2L17 9" stroke="#12302C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span>Guía de 5 estiramientos para la mañana</span>
        </div>
      </div>
    </div>

    <div style="background: #F0643A; color: #12302C; padding: 24px 60px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.01em;">Recortá a tu medida</div>
      <div style="background: #12302C; color: #FFFFFF; border-radius: 999px; padding: 10px 22px; font-size: 18px; font-weight: 700;">Talle 35–40</div>
    </div>

  </div>
</div>
</body>
</html>
